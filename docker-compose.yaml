services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nightrunner
      POSTGRES_PASSWORD: nightrunner_password
      POSTGRES_DB: nightrunner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightrunner -d nightrunner"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nightrunner:nightrunner_password@db:5432/nightrunner
      DEV_MODE: "true"
      FRONT_END_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
