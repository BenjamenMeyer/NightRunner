name: PR Quality Gates

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------------
  # 1. Backend Unit Tests & Linters
  # ------------------------------------------------------------------------------
  backend-checks:
    name: Backend Unit Tests & Linters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Backend Pytest Suite
        run: pytest -q --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"

  # ------------------------------------------------------------------------------
  # 2. Frontend Unit/Integration Tests, Oxlint & Build Gate
  # ------------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Linters, Unit/Integration Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        working-directory: nightrunner_frontend
        run: corepack enable && yarn install --frozen-lockfile

      - name: Run Frontend Linter (oxlint)
        working-directory: nightrunner_frontend
        run: yarn lint

      - name: Start Backend Docker Stack
        run: |
          docker compose up -d db oidc app
          echo "Waiting for API server & OIDC server health checks..."
          for i in {1..30}; do
            API_OK=$(curl -s -f http://127.0.0.1:8000/health > /dev/null && echo "ok" || echo "fail")
            OIDC_OK=$(curl -s -f http://localhost:4000/.well-known/openid-configuration > /dev/null && echo "ok" || echo "fail")
            if [ "$API_OK" = "ok" ] && [ "$OIDC_OK" = "ok" ]; then
              echo "API server & OIDC server are healthy!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Waiting for database seed completion..."
          docker compose run --rm seed

      - name: Run Vitest Unit & Integration Tests
        working-directory: nightrunner_frontend
        run: yarn test
        env:
          VITE_BACKEND_URL: "http://127.0.0.1:8000"
          VITE_OIDC_AUTHORITY: "http://localhost:4000"

      - name: Verify Production Build (vite build)
        working-directory: nightrunner_frontend
        run: yarn build

      - name: Storybook Level 1: Build Gate
        working-directory: nightrunner_frontend
        run: STORYBOOK_DISABLE_TELEMETRY=1 yarn build-storybook

      - name: Install Playwright Browsers for Storybook Test Runner
        working-directory: nightrunner_frontend
        run: npx playwright install --with-deps chromium

      - name: Storybook Level 2A: Headless Story Execution Tests
        working-directory: nightrunner_frontend
        run: yarn test-storybook:ci

      - name: Storybook Level 2B: Chromatic Visual Regression Testing
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: nightrunner_frontend
          exitZeroOnChanges: true
        if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}

      - name: Tear Down Stack
        if: always()
        run: docker compose down

  # ------------------------------------------------------------------------------
  # 3. Terraform Format & Validation Checks
  # ------------------------------------------------------------------------------
  terraform-checks:
    name: OpenTofu / Terraform Format & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: OpenTofu Format Check
        run: tofu -chdir=terraform fmt -check -recursive

      - name: OpenTofu Init (Offline / No Backend)
        run: tofu -chdir=terraform init -backend=false

      - name: OpenTofu Validate
        run: tofu -chdir=terraform validate
