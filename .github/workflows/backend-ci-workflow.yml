name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "nightrunner_backend/**"
      - "tests/**"
      - "api/openapi.yaml"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yaml"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - "nightrunner_backend/**"
      - "tests/**"
      - "api/openapi.yaml"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Unit & integration tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit & integration tests
        run: pytest -q --tb=short
        env:
          # Use an in-memory SQLite DB for all tests
          DATABASE_URL: "sqlite:///:memory:"

      - name: Upload coverage (optional)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 2: OpenAPI contract validation
  # ─────────────────────────────────────────────
  openapi-contract:
    name: OpenAPI contract validation
    runs-on: ubuntu-latest
    needs: unit-tests   # only run if unit tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Validate OpenAPI spec is well-formed
        run: |
          python - <<'EOF'
          import yaml, sys, pathlib
          path = pathlib.Path("api/openapi.yaml")
          try:
              doc = yaml.safe_load(path.read_text())
              assert "openapi" in doc, "Missing 'openapi' key"
              assert "paths" in doc, "Missing 'paths' key"
              print(f"✅  Spec loaded OK — {len(doc['paths'])} paths declared")
          except Exception as e:
              print(f"❌  Spec validation failed: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Run OpenAPI contract tests (schemathesis)
        run: |
          pytest tests/contract/ -q --tb=short \
            -p no:warnings \
            --hypothesis-seed=0
        env:
          DATABASE_URL: "sqlite:///:memory:"
          # schemathesis uses HYPOTHESIS_* env vars for tuning
          HYPOTHESIS_MAX_EXAMPLES: "30"
