name: Deploy to GCP

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions Web UI

jobs:
  # Check which paths changed in the push to main
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'nightrunner_backend/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'Makefile'
            frontend:
              - 'nightrunner_frontend/**'

  # Verify backend unit tests before deploying
  test-backend:
    name: Run Backend Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"

  deploy-backend:
    name: Build & Deploy Backend
    needs: [changes, test-backend]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="${{ secrets.GCP_ARTIFACT_REGISTRY_URL }}:${{ github.sha }}"
          LATEST_TAG="${{ secrets.GCP_ARTIFACT_REGISTRY_URL }}:latest"
          docker build -t $IMAGE_TAG -t $LATEST_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE }} \
            --image ${{ secrets.GCP_ARTIFACT_REGISTRY_URL }}:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }}

  # Verify frontend gates (lint, integration tests against docker-compose stack, build)
  test-frontend:
    name: Run Frontend Gates (Lint, Live Integration Tests, Build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        working-directory: nightrunner_frontend
        run: npm ci || npm install

      - name: "Gate 1: Run Linter (oxlint)"
        working-directory: nightrunner_frontend
        run: npm run lint

      - name: Start Backend Stack (App + OIDC Server + Postgres + Seed)
        run: |
          docker compose up -d
          echo "Waiting for API server health check..."
          for i in {1..20}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "API server is healthy!"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 2
          done
          echo "Waiting for database seed completion..."
          docker compose run --rm seed


      - name: "Gate 2: Run Unit & Integration Tests (vitest against Docker Compose stack)"
        working-directory: nightrunner_frontend
        run: npm run test
        env:
          VITE_BACKEND_URL: "http://127.0.0.1:8000"
          VITE_OIDC_AUTHORITY: "http://localhost:4000"

      - name: "Gate 3: Verify Production Build (vite build)"
        working-directory: nightrunner_frontend
        run: npm run build

  deploy-frontend:
    name: Deploy Frontend to GCS
    needs: [changes, test-frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Build Frontend
        working-directory: nightrunner_frontend
        run: |
          npm ci
          npx vite build
        env:
          VITE_BACKEND_URL: "https://nightrunner-backend-550013958206.us-east1.run.app"
          VITE_OIDC_AUTHORITY: "https://securetoken.google.com/${{ secrets.GCP_PROJECT_ID }}"
          VITE_OIDC_CLIENT_ID: "${{ secrets.GCP_PROJECT_ID }}"

      - name: Upload Static Assets to GCS Bucket
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: nightrunner_frontend/dist
          destination: ${{ secrets.GCP_FRONTEND_BUCKET }}
          parent: false
