components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: "john.doe"
        password:
          type: string
          example: "a-strong-password"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "a-jwt-token"
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-user-1"
          readOnly: true
        username:
          type: string
          example: "john.doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        displayName:
          type: string
          example: "John Doe"
        roles:
          type: array
          items:
            type: string
            enum:
              - admin
              - organizer
              - station_leader
              - station_member
              - volunteer
          example: ["station_leader"]
    UserRegistration:
      type: object
      properties:
        username:
          type: string
          example: "jane.doe"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"
        password:
          type: string
          format: password
          example: "another-strong-password"
          writeOnly: true
        displayName:
          type: string
          example: "Jane Doe"
    ConfigurationGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "uuid-string-group-1"
        name:
          type: string
          example: "Ropework Group"
        description:
          type: string
          nullable: true
          example: "Configuration group for ropework stations"
    Configuration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "uuid-string-config-1"
        group_id:
          type: string
          format: uuid
          example: "uuid-string-group-1"
        key:
          type: string
          example: "max_score"
        value:
          type: string
          example: "100"
        description:
          type: string
          nullable: true
          example: "Maximum score for this task"
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-event-2026"
          readOnly: true
        name:
          type: string
          example: "Night Ops 2026"
        date:
          type: string
          format: date
          example: "2026-09-15"
        description:
          type: string
          example: "The 2026 annual Night Ops event."
        roundingPrecision:
          type: integer
          example: 1000
        organizers:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-user-organizer-1"]
        stations:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-station-1", "uuid-string-station-2"]
        patrols:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-patrol-1"]
    Patrol:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-patrol-1"
          readOnly: true
        programName:
          type: string
          example: "TL Troop GA-0594"
        members:
          type: array
          items:
            $ref: '#/components/schemas/PatrolMember'
    PatrolMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-member-1"
          readOnly: true
        name:
          type: string
          example: "John Doe"
        rank:
          type: string
          example: "Navigator"
        troop:
          type: string
          example: "GA-0594"
    Station:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-station-1"
          readOnly: true
        name:
          type: string
          example: "Ropes Challenge"
        description:
          type: string
          example: "A station focused on knot-tying and lashing skills."
        activeConfigurationId:
          type: string
          format: uuid
          example: "uuid-string-config-2"
        members:
          type: array
          items:
            $ref: '#/components/schemas/StationMember'
    StationMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: "uuid-string-user-1"
        role:
          type: string
          enum:
            - station_leader
            - station_member
          example: "station_leader"
    StationConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-config-2"
          readOnly: true
        name:
          type: string
          example: "2026 Night Ops - Advanced Knots"
        description:
          type: string
          example: "Advanced knot-tying scenario for the 2026 event."
        scenario:
          type: string
          example: "The patrol must construct a tripod lashing capable of supporting a 5-gallon water jug."
        notes:
          type: string
          example: "Materials provided: 3 staves, 1 rope (15ft)."
        scoringMethod:
          type: string
          example: "WeightedSum"
    StationTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-task-1"
          readOnly: true
        description:
          type: string
          example: "Tripod lashing is secure and stable."
        scoreValue:
          oneOf:
            - $ref: '#/components/schemas/ScoreValueRange'
            - $ref: '#/components/schemas/ScoreValueDelta'
            - $ref: '#/components/schemas/ScoreValueMulti'
            - $ref: '#/components/schemas/ScoreValueCompleted'
            - $ref: '#/components/schemas/ScoreValueStopwatch'
        scoreWeight:
          type: number
          example: 5.0
        isActive:
          type: boolean
          example: true
    ScoreValueRange:
      type: object
      properties:
        type:
          type: string
          enum: [RangeRated]
        min:
          type: integer
        max:
          type: integer
    ScoreValueDelta:
      type: object
      properties:
        type:
          type: string
          enum: [DeltaTime]
        scalar:
          type: integer
          default: 100
    ScoreValueMulti:
      type: object
      properties:
        type:
          type: string
          enum: [MultiChoice]
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: integer
    ScoreValueCompleted:
      type: object
      properties:
        type:
          type: string
          enum: [Completed]
    ScoreValueStopwatch:
      type: object
      properties:
        type:
          type: string
          enum: [Stopwatch]
    ScoreSubmission:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        patrolId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        configurationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Score'
    Score:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
    EventReport:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        generatedAt:
          type: string
          format: date-time
        summary:
          type: object
          properties:
            totalPatrols:
              type: integer
            totalStations:
              type: integer
        patrolScores:
          type: array
          items:
            $ref: '#/components/schemas/PatrolScore'
    PatrolScore:
      type: object
      properties:
        patrolId:
          type: string
          format: uuid
        patrolName:
          type: string
        totalScore:
          type: number
        rank:
          type: integer
        stationBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/StationScore'
    StationScore:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        stationName:
          type: string
        score:
          type: number
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: "A descriptive error message."
