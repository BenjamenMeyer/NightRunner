                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
    delete:
      summary: Delete User
      description: Deletes a user from the system.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully.
        '404':
          description: User not found.
