info:
  name: Update Configuration
  type: http
  seq: 4
  tags:
    - Configurations

http:
  method: PUT
  url: "{{baseUrl}}/v1/configurations/:configId"
  params:
    - name: configId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": "uuid-string-config-1",
        "group_id": "uuid-string-group-1",
        "key": "max_score",
        "value": "100",
        "description": "Maximum score for this task"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

