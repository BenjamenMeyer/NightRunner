info:
  name: Get Configuration
  type: http
  seq: 3
  tags:
    - Configurations

http:
  method: GET
  url: "{{baseUrl}}/v1/configurations/:configId"
  params:
    - name: configId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Configuration object.
    request:
      url: "{{baseUrl}}/v1/configurations/:configId"
      method: GET
      params:
        - name: configId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-config-1",
            "group_id": "uuid-string-group-1",
            "key": "max_score",
            "value": "100",
            "description": "Maximum score for this task"
          }
  - name: 404 Response
    description: Configuration not found.
    request:
      url: "{{baseUrl}}/v1/configurations/:configId"
      method: GET
      params:
        - name: configId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Retrieves a specific configuration.
