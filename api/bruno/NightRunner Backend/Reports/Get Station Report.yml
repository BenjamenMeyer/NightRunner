info:
  name: Get Station Report
  type: http
  seq: 3
  tags:
    - Reports

http:
  method: GET
  url: "{{baseUrl}}/v1/reports/stations/:stationId"
  params:
    - name: stationId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The station report object.
    request:
      url: "{{baseUrl}}/v1/reports/stations/:stationId"
      method: GET
      params:
        - name: stationId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Report not found for this station.
    request:
      url: "{{baseUrl}}/v1/reports/stations/:stationId"
      method: GET
      params:
        - name: stationId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Retrieves the final scoring report for a given station.
