      body:
        type: json
        data: |-
          {
            "id": "uuid-string-group-1",
            "name": "Ropework Group",
            "description": "Configuration group for ropework stations"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-group-1",
