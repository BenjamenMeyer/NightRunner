info:
  name: Update Event
  type: http
  seq: 4
  tags:
    - Events

http:
  method: PUT
  url: "{{baseUrl}}/v1/events/:eventId"
  params:
    - name: eventId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": "uuid-string-event-2026",
        "name": "Night Ops 2026",
        "date": "2026-09-15",
        "description": "The 2026 annual Night Ops event.",
        "roundingPrecision": 1000,
        "organizers": [
          "uuid-string-user-organizer-1"
        ],
        "stations": [
          "uuid-string-station-1",
          "uuid-string-station-2"
        ],
        "patrols": [
          "uuid-string-patrol-1"
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

