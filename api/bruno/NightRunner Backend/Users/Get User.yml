info:
  name: Get User
  type: http
  seq: 3
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/v1/users/:userId"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The user object.
    request:
      url: "{{baseUrl}}/v1/users/:userId"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-user-1",
            "username": "john.doe",
            "email": "john.doe@example.com",
            "displayName": "John Doe",
            "roles": [
              "station_leader"
            ]
          }
  - name: 404 Response
    description: User not found.
    request:
      url: "{{baseUrl}}/v1/users/:userId"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Retrieves a specific user by their ID.
