info:
  name: Delete User
  type: http
  seq: 5
  tags:
    - Users

http:
  method: DELETE
  url: "{{baseUrl}}/v1/users/:userId"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: User deleted successfully.
    request:
      url: "{{baseUrl}}/v1/users/:userId"
      method: DELETE
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: User not found.
    request:
      url: "{{baseUrl}}/v1/users/:userId"
      method: DELETE
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Deletes a user from the system.
