info:
  name: Delete Patrol
  type: http
  seq: 5
  tags:
    - Patrols

http:
  method: DELETE
  url: "{{baseUrl}}/v1/patrols/:patrolId"
  params:
    - name: patrolId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Patrol deleted successfully.
    request:
      url: "{{baseUrl}}/v1/patrols/:patrolId"
      method: DELETE
      params:
        - name: patrolId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Patrol not found.
    request:
      url: "{{baseUrl}}/v1/patrols/:patrolId"
      method: DELETE
      params:
        - name: patrolId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Deletes a patrol from the system.
