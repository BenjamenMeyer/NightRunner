info:
  name: List Patrols
  type: http
  seq: 1
  tags:
    - Patrols

http:
  method: GET
  url: "{{baseUrl}}/v1/patrols"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: A list of patrols.
    request:
      url: "{{baseUrl}}/v1/patrols"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "uuid-string-patrol-1",
              "eventId": "uuid-string-event-1",
              "name": "TL Troop GA-0594",
              "members": [
                {
                  "id": "uuid-string-member-1",
                  "name": "John Doe",
                  "rank": "Navigator",
                  "troop": "GA-0594"
                }
              ]
            }
          ]

docs: Retrieves a list of all patrols.
