info:
  name: Update Station
  type: http
  seq: 4
  tags:
    - Stations

http:
  method: PUT
  url: "{{baseUrl}}/v1/stations/:stationId"
  params:
    - name: stationId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": "uuid-string-station-1",
        "eventId": "uuid-string-event-1",
        "name": "Ropes Challenge",
        "description": "A station focused on knot-tying and lashing skills.",
        "activeConfigurationId": "uuid-string-config-2",
        "members": [
          {
            "userId": "uuid-string-user-1",
            "role": "station_leader"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Station updated successfully.
    request:
      url: "{{baseUrl}}/v1/stations/:stationId"
      method: PUT
      params:
        - name: stationId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-station-1",
            "eventId": "uuid-string-event-1",
            "name": "Ropes Challenge",
            "description": "A station focused on knot-tying and lashing skills.",
            "activeConfigurationId": "uuid-string-config-2",
            "members": [
              {
                "userId": "uuid-string-user-1",
                "role": "station_leader"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-station-1",
            "eventId": "uuid-string-event-1",
            "name": "Ropes Challenge",
            "description": "A station focused on knot-tying and lashing skills.",
            "activeConfigurationId": "uuid-string-config-2",
            "members": [
              {
                "userId": "uuid-string-user-1",
                "role": "station_leader"
              }
            ]
          }
  - name: 404 Response
    description: Station not found.
    request:
      url: "{{baseUrl}}/v1/stations/:stationId"
      method: PUT
      params:
        - name: stationId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "id": "uuid-string-station-1",
            "eventId": "uuid-string-event-1",
            "name": "Ropes Challenge",
            "description": "A station focused on knot-tying and lashing skills.",
            "activeConfigurationId": "uuid-string-config-2",
            "members": [
              {
                "userId": "uuid-string-user-1",
                "role": "station_leader"
              }
            ]
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Updates a station's details.
