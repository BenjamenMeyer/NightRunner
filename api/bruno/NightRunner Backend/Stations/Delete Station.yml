info:
  name: Delete Station
  type: http
  seq: 5
  tags:
    - Stations

http:
  method: DELETE
  url: "{{baseUrl}}/v1/stations/:stationId"
  params:
    - name: stationId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Station deleted successfully.
    request:
      url: "{{baseUrl}}/v1/stations/:stationId"
      method: DELETE
      params:
        - name: stationId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Station not found.
    request:
      url: "{{baseUrl}}/v1/stations/:stationId"
      method: DELETE
      params:
        - name: stationId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Deletes a station from the system.
