# docker-compose.authentik.yaml
#
# Docker Compose overlay for running Authentik as a full local OIDC Identity Provider
# instead of the lightweight oidc-server-mock.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.authentik.yaml up -d
#

services:
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    restart: always
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:-nightrunner-dev-authentik-secret-key-32-chars}"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__USER: nightrunner
      AUTHENTIK_POSTGRESQL__PASSWORD: nightrunner_password
      AUTHENTIK_POSTGRESQL__NAME: nightrunner
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:-adminpassword}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}"
      AUTHENTIK_BLUEPRINTS_DIR: /blueprints
    volumes:
      - ./authentik/blueprints:/blueprints/custom
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Point backend to Authentik OIDC provider
  app:
    environment:
      OIDC_ISSUER: "http://localhost:9000/application/o/nightrunner/"
      OIDC_AUDIENCE: "client-id"
      JWKS_URL: "http://authentik-server:9000/application/o/nightrunner/jwks/"

  # Point frontend to Authentik OIDC provider
  frontend:
    build:
      args:
        VITE_OIDC_AUTHORITY: "http://localhost:9000/application/o/nightrunner/"
        VITE_OIDC_CLIENT_ID: "client-id"
